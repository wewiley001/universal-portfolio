<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content — Portfolio</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --accent: #f81562; --hover: #5df6fe; --bar-h: 52px; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: var(--bar-h);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: #000;
        }
        .back-link {
            color: rgba(255,255,255,0.35);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: color .2s;
        }
        .back-link:hover { color: var(--hover); }
        .topbar-brand { display: flex; align-items: center; gap: .5rem; }
        .topbar-brand svg { fill: var(--accent); width: 20px; height: 20px; }
        .topbar-brand span {
            font-size: 0.74rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
        }

        /* ── Gallery grid — 8 cards, 6 cols × 8 rows ── */
        .gallery {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 6px;
            overflow: hidden;
        }

        .card:nth-child(1)  { grid-column: 2;   grid-row: 1 / 4; } /* Motion Graphics        — 1c × 3r            */
        .card:nth-child(2)  { grid-column: 5/7; grid-row: 5 / 9; } /* Professional Video     — 2c × 4r bottom     */
        .card:nth-child(3)  { grid-column: 3/5; grid-row: 4 / 6; } /* Roleplay Comedy        — 2c × 2r            */
        .card:nth-child(4)  { grid-column: 2;   grid-row: 4 / 6; } /* Commentary & Vlog      — 1c × 2r            */
        .card:nth-child(5)  { grid-column: 3/5; grid-row: 1 / 4; } /* CROWNMOBB Product      — 2c × 3r            */
        .card:nth-child(6)  { grid-column: 5/7; grid-row: 1 / 5; } /* Graphic Design         — 2c × 4r            */
        .card:nth-child(7)  { grid-column: 1;   grid-row: 1 / 9; } /* Virtual Avatar         — FULL HEIGHT        */
        .card:nth-child(8)  { grid-column: 2/5; grid-row: 6 / 9; } /* Cyberpunk Apartment 3D — 3c × 3r            */

        /* ── Cards ── */
        .card {
            position: relative;
            display: block;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            background: #070707;
            border: 1px solid #f81562;
            transition: border-color .25s;
        }
        .card:hover { border-color: #fdef03; z-index: 1; }

        .card-thumb { position: absolute; inset: 0; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.5; }

        /* ── Hover overlay ── */
        .card-info {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            text-align: center;
            padding: 1rem;
            background: linear-gradient(to bottom, transparent 0%, rgba(253,239,3,.88) 100%);
            opacity: 0;
            transition: opacity .25s;
        }
        .card:hover .card-info { opacity: 1; }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: .03em;
            text-transform: uppercase;
            text-shadow: 0 1px 8px rgba(0,0,0,.9), 0 0 20px rgba(0,0,0,.7);
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-tag {
            text-shadow: 0 1px 6px rgba(0,0,0,.9);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #fff;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 2px;
            padding: 2px 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }


    </style>
</head>
